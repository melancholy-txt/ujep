{% extends "base.html" %}

{% block podnadpis %}Kočky{% endblock %}

{% block hlavniobsah %}
    <h2>Seznam koček k adopci</h2>
    <ol>
        {% for kocka in data %}
        <li>
            <ul>
                <li> {{ kocka.jmeno }} </li>
                <li> {{ kocka.vek }} let </li>
                <li> {{ kocka.barva }} </li>
            </ul>
        </li>
        {% endfor %}
    </ol>
{% endblock %}
