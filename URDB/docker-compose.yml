services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: f1_database
    ports:
    - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dbnet
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: f1_database
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dbnet 
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOSTS: mysql,mariadb
      PMA_PORTS: 3306,3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - mysql
      - mariadb
    networks:
      - dbnet
volumes:
  mysql_data:
  mariadb_data:

networks:
  dbnet:
